# Claude Code session indicators. Sourced after tpm/themepack (see ~/.tmux.conf),
# otherwise the theme overwrites the window formats.
# @claude_state is set by ~/.claude/hooks/tmux-state.sh: running | waiting | done.
%hidden CLAUDE_BADGE="#{?#{==:#{@claude_state},waiting},🔔 ,#{?#{==:#{@claude_state},running},⏳ ,#{?#{==:#{@claude_state},done},✅ ,}}}"

set -g window-status-format "  ${CLAUDE_BADGE}#I:#W#F  "
set -g window-status-current-format "#[fg=colour233,bg=black]#[fg=colour81,nobold] ${CLAUDE_BADGE}#I:#W#F #[fg=colour233,bg=black,nobold]"
set -g window-status-bell-style "fg=colour214,bold"

# ✅ means "finished, not yet seen": clear it once you switch to the window.
set-hook -g session-window-changed 'if -F "#{==:#{@claude_state},done}" "set -wu @claude_state"'
